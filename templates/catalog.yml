# Caller stub for the data-catalog contribution mechanism.
#
# Drop this file into a contributing repo as `.github/workflows/catalog.yml`.
# On every merge to main it refreshes that repo's OWN contribution shard in
# SocioProphet/prophet-core-catalog (Lord Michael's "each repo updates its
# contribution on merge to main" directive).
#
# CREDENTIAL — nothing for you to set. Estate policy is secrets are MINTED IN CI,
# never PATs, and never a per-consumer operator secret. The reusable workflow
# mints a short-lived, catalog-scoped GitHub App installation token itself, from
# the estate's SHARED ops App (the same GH_OPS_APP_ID / GH_OPS_APP_PRIVATE_KEY
# org secrets board-parity.yml and estate-ci-health.yml already use). Those org
# secrets ALREADY EXIST — `secrets: inherit` just forwards them; you create no
# new secret. Until the shared App is configured (vars.GH_OPS_APP_CONFIGURED ==
# 'true') the workflow is INERT — it no-ops and exits 0 — so it is safe to add
# ahead of the App bootstrap.
#
# To contribute additional datasets, pass `datasets:` under `with:` as
# whitespace/comma-separated <dataset>:<extractor> pairs, e.g.
#   with:
#     datasets: "regex-operational-dataset:extract_regex ci-workflows-tests:extract_ci_workflows_tests"
#
# SUPPLY CHAIN: this template pins `uses:` to @main for readability, but a real
# consumer SHOULD pin to an immutable commit SHA of git-ops-standards with a
# trailing `# <branch/tag>` comment, e.g.
#   uses: SocioProphet/git-ops-standards/.github/workflows/catalog-contribute.yml@<40-char-sha>  # main
# so a mutable branch can't silently change what runs in your repo.

name: catalog-contribute

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contribute:
    uses: SocioProphet/git-ops-standards/.github/workflows/catalog-contribute.yml@main
    # The reusable workflow mints the catalog token in CI from the SHARED ops-App
    # org secrets (GH_OPS_APP_ID / GH_OPS_APP_PRIVATE_KEY). These already exist;
    # you create no new secret. Two ways to pass them:
    #
    #   RECOMMENDED — map ONLY the two the workflow needs (least exposure):
    secrets:
      GH_OPS_APP_ID: ${{ secrets.GH_OPS_APP_ID }}
      GH_OPS_APP_PRIVATE_KEY: ${{ secrets.GH_OPS_APP_PRIVATE_KEY }}
    #
    #   Or, if you prefer, `secrets: inherit` (forwards ALL your secrets — simpler
    #   but broader). Replace the `secrets:` block above with a single line:
    #     secrets: inherit
