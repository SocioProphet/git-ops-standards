# Caller stub for the data-catalog contribution mechanism.
#
# Drop this file into a contributing repo as `.github/workflows/catalog.yml`.
# On every merge to main it refreshes that repo's OWN contribution shard in
# SocioProphet/prophet-core-catalog (Lord Michael's "each repo updates its
# contribution on merge to main" directive).
#
# Prerequisite (estate policy: secrets are MINTED IN CI, never PATs): the two
# org secrets CATALOG_APP_ID + CATALOG_APP_PRIVATE_KEY of the
# `socioprophet-catalog-contributor` GitHub App must exist. The reusable
# workflow uses them to MINT a short-lived installation token in CI (contents +
# pull_requests write on prophet-core-catalog only). Until BOTH are set this
# workflow is INERT — it detects the missing credentials and no-ops. So it is
# safe to add ahead of the App.
#
# To contribute additional datasets, pass `datasets:` under `with:` as
# whitespace/comma-separated <dataset>:<extractor> pairs, e.g.
#   with:
#     datasets: "regex-operational-dataset:extract_regex ci-workflows-tests:extract_ci_workflows_tests"
#
# SUPPLY CHAIN: this template pins `uses:` to @main for readability, but a real
# consumer SHOULD pin to an immutable commit SHA of git-ops-standards with a
# trailing `# <branch/tag>` comment, e.g.
#   uses: SocioProphet/git-ops-standards/.github/workflows/catalog-contribute.yml@<40-char-sha>  # main
# so a mutable branch can't silently change what runs in your repo.

name: catalog-contribute

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contribute:
    uses: SocioProphet/git-ops-standards/.github/workflows/catalog-contribute.yml@main
    # Passes CATALOG_APP_ID / CATALOG_APP_PRIVATE_KEY through so the reusable
    # workflow can mint the catalog token in CI. `inherit` forwards all org
    # secrets; map the two explicitly instead if you prefer least exposure.
    secrets: inherit
