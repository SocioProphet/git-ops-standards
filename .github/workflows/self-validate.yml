name: self-validate

# This repo's own CI. Runs the registry validator and the adversarial audit
# tests on every push/PR to this repo -- the standard validates itself
# before anyone downstream trusts it. See feedback_self_validating_checker.md:
# a scanner must exclude itself from its own blind spots, not just scan
# everyone else.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate controls.yaml registry
        run: python3 scripts/validate_controls_registry.py
      - name: Prove estate_drift_audit.py fires both ways
        run: python3 tests/test_estate_drift_audit.py
      - name: Prove estate_ci_health_audit.py fires both ways
        run: python3 tests/test_estate_ci_health_audit.py
