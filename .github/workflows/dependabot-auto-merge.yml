name: dependabot-auto-merge (git-ops-standards)

# Reusable workflow: arms --auto merge on a Dependabot PR for safe (non-major) semver
# bumps, so routine version PRs across the estate don't each need a manual look.
#
# This does NOT bypass any required check. `gh pr merge --auto` only ARMS auto-merge --
# the PR still has to clear every required status check (gate / check,
# diagnostics-gate, CodeQL, whatever the repo requires) exactly as if a human had
# clicked merge. A red check leaves it sitting armed-but-blocked, same as any other PR.
#
# Major-version bumps are deliberately excluded (left for manual review): the ones
# already sitting open across the estate at the time this was written include things
# like vite 5->6, react-router-dom 5->6, eslint 7->8 -- semver-major means the
# maintainer is telling you something can break, and a bot should not wave that
# through unattended.
#
# Any repo in the estate calls this from its own workflow file:
#
#   jobs:
#     dependabot:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: SocioProphet/git-ops-standards/.github/workflows/dependabot-auto-merge.yml@main
#
# The caller-side `permissions:` block is not optional -- see pr-merge-gate.yml's
# comment on the same requirement (a reusable workflow can never be granted more than
# the calling job explicitly passes; omitting it is a startup_failure with no useful
# API error).

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Fail-closed on the classifier itself: if fetch-metadata couldn't determine the
      # update type for some reason, outputs.update-type is empty, which matches
      # neither branch below -- nothing gets armed, not "assume safe."
      - name: Arm auto-merge for patch/minor bumps
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Leave major bumps for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Major-version bump -- not auto-merged. Needs a manual look before merging."
