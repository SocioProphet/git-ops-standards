name: catalog-contribute

# Reusable workflow: a caller repo runs this on merge to main to refresh ITS OWN
# contribution shard in the data catalog (SocioProphet/prophet-core-catalog),
# implementing Lord Michael's "each repo updates its contribution on merge to
# main" directive.
#
# It checks out the caller repo, fetches extractors/ from the catalog repo
# (pinned by ref = single source of truth for extraction), runs them scoped to
# the caller, and opens/updates a PR to the catalog writing
# datasets/<ds>/contributions/<caller-repo>.jsonl.
#
# CREDENTIAL — MINTED IN CI, NEVER A HUMAN-SET SECRET
# ---------------------------------------------------
# The cross-repo write to prophet-core-catalog needs a credential. Per estate
# policy (secrets are MINTED in CI, never long-lived PATs, and no per-consumer
# operator secret), this workflow mints a SHORT-LIVED GitHub App installation
# token itself, from the estate's SHARED ops App — the same App board-parity.yml
# and estate-ci-health.yml already mint from:
#
#   secrets.GH_OPS_APP_ID           — the shared org App's numeric id
#   secrets.GH_OPS_APP_PRIVATE_KEY  — its PEM private key
#   vars.GH_OPS_APP_CONFIGURED      — 'true' once the App is bootstrapped
#
# These org secrets ALREADY EXIST (one-time estate bootstrap, shared across all
# ops workflows); a catalog consumer sets NOTHING. There is NO catalog-specific
# secret — no CATALOG_APP_ID, no CATALOG_APP_PRIVATE_KEY, no CATALOG_CONTRIB_TOKEN.
# `actions/create-github-app-token` signs a JWT with the App key and exchanges it
# for an installation token scoped (via `repositories:`) to prophet-core-catalog
# ONLY, so even though the App is installed org-wide the minted token can write
# nowhere else. The token expires when the job ends; the private key is never
# echoed and the token is never hard-coded.
#
# The two App secrets are DECLARED named inputs below (both required: false), so
# a caller can map ONLY those two (least exposure, recommended) or fall back to
# `secrets: inherit` — either way these are ORG secrets already provisioned for
# the ops App, so passing them sets no new secret; it just makes the existing
# ones visible to this called workflow. See templates/catalog.yml.
#
# INERT until the shared App is configured: if vars.GH_OPS_APP_CONFIGURED != true
# (or the secrets are absent) the job no-ops and exits 0 — exactly like
# board-parity.yml and estate-ci-health.yml — so consumers are safe to wire ahead
# of the App bootstrap.

on:
  workflow_call:
    inputs:
      repo_name:
        description: >-
          Caller repo short name for the shard path / sources[].repo. Leave unset
          to derive it reliably from GITHUB_REPOSITORY (owner stripped).
        type: string
        default: ""
      catalog_repo:
        description: "owner/name of the catalog repo to contribute to."
        type: string
        default: "SocioProphet/prophet-core-catalog"
      extractors_ref:
        description: "git ref of the catalog repo to fetch extractors/ from (pin for reproducibility)."
        type: string
        default: "main"
      datasets:
        description: >-
          Whitespace/comma-separated <dataset>:<extractor-module> pairs to run,
          e.g. "regex-operational-dataset:extract_regex". Defaults to regex only.
        type: string
        default: "regex-operational-dataset:extract_regex"
    secrets:
      # Named so the reusable-workflow interface is EXPLICIT: a caller can map
      # ONLY these two (least exposure) instead of `secrets: inherit`-ing every
      # secret it holds. Both required: false so `secrets: inherit` still works
      # and, when they are absent, the inert-guard trips (job no-ops, exits 0).
      # The credential is still MINTED in CI from these org secrets — never a
      # pre-made token passed in. See the header note.
      GH_OPS_APP_ID:
        description: >-
          Numeric id of the estate's shared ops GitHub App (same one board-parity
          / estate-ci-health mint from). Used to MINT a short-lived, catalog-scoped
          installation token in CI.
        required: false
      GH_OPS_APP_PRIVATE_KEY:
        description: >-
          PEM private key of the shared ops App. Used to MINT the token in CI.
          Never a PAT, never echoed.
        required: false

# Least privilege, matching this repo's reusable-workflow convention
# (.github/workflows/pr-merge-gate.yml). The cross-repo write is done with the
# MINTED installation token, so the built-in GITHUB_TOKEN only needs read to
# check out the caller.
permissions:
  contents: read

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve caller repo name + inert guard
        id: guard
        env:
          INPUT_REPO_NAME: ${{ inputs.repo_name }}
          APP_CONFIGURED: ${{ vars.GH_OPS_APP_CONFIGURED }}
          APP_ID: ${{ secrets.GH_OPS_APP_ID }}
          APP_KEY: ${{ secrets.GH_OPS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Reliable caller repo name: prefer the explicit input, else strip the
          # owner from GITHUB_REPOSITORY (always populated). github.event.repository
          # .name is NOT reliably present under workflow_call, so never use it for
          # the shard path -- an empty name would write ".jsonl". Fail fast instead.
          name="${INPUT_REPO_NAME}"
          if [ -z "${name}" ]; then
            name="${GITHUB_REPOSITORY#*/}"
          fi
          if [ -z "${name}" ]; then
            echo "::error::could not resolve caller repo name (inputs.repo_name empty and GITHUB_REPOSITORY unset)"
            exit 1
          fi
          echo "repo_name=${name}" >> "$GITHUB_OUTPUT"
          echo "resolved caller repo name: ${name}"

          # Inert until the SHARED ops App is bootstrapped. Gated on the same
          # vars.GH_OPS_APP_CONFIGURED flag board-parity.yml / estate-ci-health.yml
          # use, and defensively re-checks the two secrets are actually forwarded
          # (a caller that forgot `secrets: inherit` would otherwise mint nothing).
          if [ "${APP_CONFIGURED}" = "true" ] && [ -n "${APP_ID}" ] && [ -n "${APP_KEY}" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "GH_OPS App not configured/forwarded (vars.GH_OPS_APP_CONFIGURED != true, or the caller"
            echo "did not 'secrets: inherit' GH_OPS_APP_ID/GH_OPS_APP_PRIVATE_KEY) -- this contributor is"
            echo "INERT (no-op). Exiting 0."
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint catalog-scoped App token (never a static PAT)
        id: app-token
        if: steps.guard.outputs.active == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.GH_OPS_APP_ID }}
          private-key: ${{ secrets.GH_OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scope the installation token to the catalog repo ONLY. The App is
          # installed org-wide, but this token can write nowhere else.
          repositories: prophet-core-catalog

      - name: Checkout caller repo (read-only scan target)
        if: steps.guard.outputs.active == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.0
        with:
          path: caller

      - name: Checkout catalog repo (extractors + write target)
        if: steps.guard.outputs.active == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.0
        with:
          repository: ${{ inputs.catalog_repo }}
          ref: ${{ inputs.extractors_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: catalog

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.guard.outputs.active == 'true'
        with:
          python-version: "3.12"

      - name: Run extractors scoped to the caller repo
        if: steps.guard.outputs.active == 'true'
        env:
          CALLER_REPO: ${{ steps.guard.outputs.repo_name }}
          DATASETS: ${{ inputs.datasets }}
        run: |
          set -euo pipefail
          for pair in $(echo "${DATASETS}" | tr ',' ' '); do
            ds="${pair%%:*}"
            mod="${pair##*:}"
            out="catalog/datasets/${ds}/contributions/${CALLER_REPO}.jsonl"
            mkdir -p "catalog/datasets/${ds}/contributions"
            echo "extracting ${mod} -> ${out}"
            python3 "catalog/extractors/${mod}.py" caller "${CALLER_REPO}" --out "${out}"
          done

      - name: Open/update the catalog contribution PR
        if: steps.guard.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CALLER_REPO: ${{ steps.guard.outputs.repo_name }}
          CATALOG_REPO: ${{ inputs.catalog_repo }}
        working-directory: catalog
        run: |
          set -euo pipefail
          branch="catalog/contrib-${CALLER_REPO}"
          git config user.name  "catalog-contributor[bot]"
          git config user.email "catalog-contributor[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add datasets/*/contributions/${CALLER_REPO}.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no shard changes for ${CALLER_REPO} — nothing to contribute (idempotent no-op)."
            exit 0
          fi
          git commit -m "chore(catalog): refresh ${CALLER_REPO} contribution shard(s)"
          git push --force-with-lease origin "${branch}"
          if [ -z "$(gh pr list --repo "${CATALOG_REPO}" --head "${branch}" --state open --json number -q '.[].number')" ]; then
            gh pr create --repo "${CATALOG_REPO}" \
              --base main --head "${branch}" \
              --title "chore(catalog): ${CALLER_REPO} contribution shard" \
              --body "Automated per-repo catalog contribution from \`${CALLER_REPO}\` on merge to main (Lord Michael's 'each repo updates its contribution' directive). Regenerated by the git-ops-standards reusable workflow; merging triggers assemble-catalog.yml."
          else
            echo "PR already open for ${branch} — push updated it."
          fi
