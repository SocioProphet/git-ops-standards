name: catalog-contribute

# Reusable workflow: a caller repo runs this on merge to main to refresh ITS OWN
# contribution shard in the data catalog (SocioProphet/prophet-core-catalog),
# implementing Lord Michael's "each repo updates its contribution on merge to
# main" directive.
#
# It checks out the caller repo, fetches extractors/ from the catalog repo
# (pinned by ref = single source of truth for extraction), runs them scoped to
# the caller, and opens/updates a PR to the catalog writing
# datasets/<ds>/contributions/<caller-repo>.jsonl.
#
# CROSS-REPO CREDENTIAL — MINTED IN CI, NEVER A PAT (estate policy: secrets are
# minted in CI). This workflow does NOT accept a pre-minted token. It MINTS a
# short-lived GitHub App installation token IN CI via
# actions/create-github-app-token, scoped to prophet-core-catalog only, from the
# App's id + private key. The App is `socioprophet-catalog-contributor` — a
# GitHub App installed on SocioProphet/prophet-core-catalog with contents:write
# + pull_requests:write on THAT repo only (no org-admin, no other repos). Callers
# wire two org secrets (inherit or map explicitly):
#
#   jobs:
#     contribute:
#       permissions:
#         contents: read
#       uses: SocioProphet/git-ops-standards/.github/workflows/catalog-contribute.yml@<sha>
#       secrets: inherit          # or map CATALOG_APP_ID / CATALOG_APP_PRIVATE_KEY explicitly
#
# The minted token (steps.mint.outputs.token) — not the workflow's own
# GITHUB_TOKEN — performs the cross-repo checkout, push and PR, so the top-level
# `permissions:` below only needs `contents: read` (to check out the caller).
# The token is short-lived (expires when the job ends) and auto-revoked. Until
# BOTH app secrets are set the job is INERT: it exits 0 without touching anything,
# so consumers are safe to wire ahead of the App.

on:
  workflow_call:
    inputs:
      repo_name:
        description: >-
          Caller repo short name for the shard path / sources[].repo. Leave unset
          to derive it reliably from GITHUB_REPOSITORY (owner stripped).
        type: string
        default: ""
      catalog_repo:
        description: "owner/name of the catalog repo to contribute to."
        type: string
        default: "SocioProphet/prophet-core-catalog"
      extractors_ref:
        description: "git ref of the catalog repo to fetch extractors/ from (pin for reproducibility)."
        type: string
        default: "main"
      datasets:
        description: >-
          Whitespace/comma-separated <dataset>:<extractor-module> pairs to run,
          e.g. "regex-operational-dataset:extract_regex". Defaults to regex only.
        type: string
        default: "regex-operational-dataset:extract_regex"
    secrets:
      CATALOG_APP_ID:
        description: >-
          App id of the `socioprophet-catalog-contributor` GitHub App. Used to
          MINT a short-lived installation token in CI. Not required so the job
          can stay inert until the App is wired.
        required: false
      CATALOG_APP_PRIVATE_KEY:
        description: >-
          PEM private key of the `socioprophet-catalog-contributor` GitHub App.
          Used to MINT a short-lived installation token in CI. Never a PAT.
        required: false

# Least privilege, matching this repo's reusable-workflow convention
# (.github/workflows/pr-merge-gate.yml). The cross-repo write is done with the
# MINTED app token, so the built-in GITHUB_TOKEN only needs read to check out.
permissions:
  contents: read

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve caller repo name + inert-credential guard
        id: guard
        env:
          CATALOG_APP_ID: ${{ secrets.CATALOG_APP_ID }}
          CATALOG_APP_PRIVATE_KEY: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          INPUT_REPO_NAME: ${{ inputs.repo_name }}
        run: |
          set -euo pipefail
          # Reliable caller repo name: prefer the explicit input, else strip the
          # owner from GITHUB_REPOSITORY (always populated). github.event.repository
          # .name is NOT reliably present under workflow_call, so never use it for
          # the shard path -- an empty name would write ".jsonl". Fail fast instead.
          name="${INPUT_REPO_NAME}"
          if [ -z "${name}" ]; then
            name="${GITHUB_REPOSITORY#*/}"
          fi
          if [ -z "${name}" ]; then
            echo "::error::could not resolve caller repo name (inputs.repo_name empty and GITHUB_REPOSITORY unset)"
            exit 1
          fi
          echo "repo_name=${name}" >> "$GITHUB_OUTPUT"
          echo "resolved caller repo name: ${name}"
          # Inert until BOTH app credentials are wired. We mint the token in CI
          # (never a PAT); with either secret missing there is nothing to mint,
          # so no-op cleanly. The message names the SECRETS callers must set.
          if [ -z "${CATALOG_APP_ID}" ] || [ -z "${CATALOG_APP_PRIVATE_KEY}" ]; then
            echo "CATALOG_APP_ID / CATALOG_APP_PRIVATE_KEY not both set -- cannot mint the catalog token; this contributor is INERT (no-op). Exiting 0."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint short-lived catalog token (GitHub App installation token)
        id: mint
        if: steps.guard.outputs.active == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: SocioProphet
          # Scope the installation token to the catalog repo ONLY.
          repositories: prophet-core-catalog

      - name: Checkout caller repo (read-only scan target)
        if: steps.guard.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          path: caller

      - name: Checkout catalog repo (extractors + write target)
        if: steps.guard.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.catalog_repo }}
          ref: ${{ inputs.extractors_ref }}
          token: ${{ steps.mint.outputs.token }}
          path: catalog

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.active == 'true'
        with:
          python-version: "3.12"

      - name: Run extractors scoped to the caller repo
        if: steps.guard.outputs.active == 'true'
        env:
          CALLER_REPO: ${{ steps.guard.outputs.repo_name }}
          DATASETS: ${{ inputs.datasets }}
        run: |
          set -euo pipefail
          for pair in $(echo "${DATASETS}" | tr ',' ' '); do
            ds="${pair%%:*}"
            mod="${pair##*:}"
            out="catalog/datasets/${ds}/contributions/${CALLER_REPO}.jsonl"
            mkdir -p "catalog/datasets/${ds}/contributions"
            echo "extracting ${mod} -> ${out}"
            python3 "catalog/extractors/${mod}.py" caller "${CALLER_REPO}" --out "${out}"
          done

      - name: Open/update the catalog contribution PR
        if: steps.guard.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          CALLER_REPO: ${{ steps.guard.outputs.repo_name }}
          CATALOG_REPO: ${{ inputs.catalog_repo }}
        working-directory: catalog
        run: |
          set -euo pipefail
          branch="catalog/contrib-${CALLER_REPO}"
          git config user.name  "catalog-contributor[bot]"
          git config user.email "catalog-contributor[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add datasets/*/contributions/${CALLER_REPO}.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no shard changes for ${CALLER_REPO} — nothing to contribute (idempotent no-op)."
            exit 0
          fi
          git commit -m "chore(catalog): refresh ${CALLER_REPO} contribution shard(s)"
          git push --force-with-lease origin "${branch}"
          if [ -z "$(gh pr list --repo "${CATALOG_REPO}" --head "${branch}" --state open --json number -q '.[].number')" ]; then
            gh pr create --repo "${CATALOG_REPO}" \
              --base main --head "${branch}" \
              --title "chore(catalog): ${CALLER_REPO} contribution shard" \
              --body "Automated per-repo catalog contribution from \`${CALLER_REPO}\` on merge to main (Lord Michael's 'each repo updates its contribution' directive). Regenerated by the git-ops-standards reusable workflow; merging triggers assemble-catalog.yml."
          else
            echo "PR already open for ${branch} — push updated it."
          fi
