# Machine-checkable controls registry.
#
# Agent-agnostic on purpose: no Claude-specific syntax, no assumption about
# which tool is reading this. Each control is (id, title, applies_to, check,
# severity, remediation, incident). "check" is a human-readable description
# of the detection logic, not executable code -- executable checks live in
# scripts/estate_drift_audit.py and should implement these IDs by name.
#
# When you add a control, it must cite an incident (a real thing that went
# wrong), or it doesn't belong here -- see README.md.
#
# version: bump on any control added/changed/removed. Consumers (memory
# entries, per-repo CLAUDE.md pointers, deployed agents) record which
# version they last synced against -- see bindings/*.md. Staleness itself
# is a checkable condition (scripts/check_registry_staleness.py), not a
# silent drift.

version: "1.4.0"

controls:
  - id: naming-canonical-bare-name
    title: Repo directory name must be the bare repo name, no org prefix, no abbreviation
    applies_to: local checkout directories
    check: >
      For each git repo directory, its basename equals the repo name from
      its origin remote URL exactly (case-sensitive, hyphens preserved).
      Flag anything matching `*__*` (org-prefix convention), anything with
      a trailing ` 2`/`-main` (duplicate-download artifact), and anything
      whose name doesn't appear in its own remote URL at all.
    severity: low
    remediation: Rename to the bare name; if a genuine name collision exists
      across two different orgs, disambiguate explicitly and permanently.
    incident: 2026-07-31-estate-cleanup

  - id: naming-worktree-suffix
    title: Linked worktrees must be named <repo>-<feature-slug>.wt
    applies_to: git worktree directories
    check: >
      For each directory that is a linked worktree (git rev-parse
      --git-common-dir differs from its own .git), its name starts with
      the bare repo name and ends in `.wt`. Flag abbreviated prefixes
      (e.g. `pp-*`) and prefix-instead-of-suffix conventions (`wt-*`).
    severity: low
    remediation: Rename via `git worktree move` (safe on an in-flight branch).
    incident: 2026-07-31-estate-cleanup

  - id: duplicate-remote-clones
    title: No repo should have more than one local clone (worktrees excepted)
    applies_to: all local checkouts
    check: >
      Group all local git directories by `git remote get-url origin`
      (normalize case, since GitHub org/repo names are case-insensitive).
      Any group with more than one member that are NOT linked worktrees of
      each other is a violation.
    severity: medium
    remediation: >
      Compare branch/dirty/sync state of each duplicate. Keep the most
      current; before deleting the rest, verify (not assume) their unique
      branches are merged or pushed (see capture-before-delete-verified).
    incident: 2026-07-31-estate-cleanup

  - id: capture-before-delete-verified
    title: Never delete a branch/worktree/clone without verifying real upstream capture
    applies_to: any deletion of git-tracked content
    check: >
      Before deletion, verify at least one of: (a) exact commit is an
      ancestor of the target's current default branch (fetch first); (b)
      branch is pushed AND referenced by an open or merged PR; (c) branch is
      pushed with no PR (weakest acceptable bar -- confirm someone knows).
      A plain "ahead/behind" count against a possibly-stale local
      tracking ref is NOT sufficient evidence on its own.
    severity: high
    remediation: Push the branch/commit before deleting anything referencing it.
    incident: 2026-07-31-estate-cleanup

  - id: squash-merge-false-signal
    title: Don't trust ahead/behind or ancestor checks alone under a squash-merge workflow
    applies_to: repos using squash-merge (check org/repo settings or just observe PR history)
    check: >
      If a repo squash-merges PRs, a merged branch's local ref will
      permanently show nonzero "ahead of upstream" and will permanently
      fail an is-ancestor-of-main check, even though its content is fully
      integrated. Cross-reference actual PR state
      (`gh pr list --head <branch> --state all`) before treating either
      signal as evidence of real drift.
    severity: medium
    remediation: n/a (detection-methodology control, not a fix-it control)
    incident: 2026-07-31-estate-cleanup

  - id: cross-repo-path-dependency-pinned
    title: Local path dependencies on another repo must document which ref they need
    applies_to: "Cargo.toml path deps, sys.path inserts, npm file: deps, etc."
    check: >
      For each local path dependency crossing a repo boundary, a comment at
      the declaration states which branch/commit the dependency needs (not
      just "assume it's checked out"). If the needed content isn't on the
      target's default branch, the dependency must name the branch/PR it
      actually needs.
    severity: high
    remediation: >
      Add the comment; if pointing at an unmerged branch, ensure a worktree
      for that exact branch exists locally (recreate if deleted) and CI has
      an equivalent explicit cross-repo checkout step.
    incident: 2026-07-31-estate-cleanup

  - id: ci-cross-repo-checkout-explicit
    title: CI must explicitly check out any sibling repo a test/build needs
    applies_to: CI workflow definitions
    check: >
      For any test that shells out to or imports from another repo's code
      (not vendored, not a published package), the CI workflow has an
      explicit second `actions/checkout` (or equivalent) step with a named
      path, at the same relative location the code expects a local-dev
      fallback to find it. A test that silently fail-closes in CI because
      the dependency isn't there is a false-negative on the actual coverage
      the test claims to provide.
    severity: high
    remediation: Add the checkout step; verify locally by simulating the
      exact directory layout CI will produce before pushing.
    incident: 2026-07-31-estate-cleanup

  - id: pr-merge-gate
    title: A PR must pass CI, have review comments addressed, and be freshly MERGEABLE before merging
    applies_to: any PR about to be merged
    check: >
      (a) all required checks green or explained (transient/unrelated
      flakes only); (b) every review comment (including inline, not just
      top-level) addressed or explicitly dismissed with reasoning; (c) if no
      automated reviewer exists on this repo, an adversarial self-review was
      done; (d) `mergeable` state is MERGEABLE, checked fresh (not cached
      from when the PR was opened).
    severity: high
    remediation: Fix failures, address comments, rebase if conflicting, re-check mergeable state.
    incident: 2026-07-31-estate-cleanup

  - id: worktree-definition-of-done
    title: Every worktree has an owner, a target PR/branch, and no unpushed commits once "done"
    applies_to: git worktree directories
    check: >
      For each worktree, its branch either has an open PR (Project still
      active) or is merged with zero unpushed commits (Project done, safe
      to remove). A worktree with neither -- unmerged, no open PR, no
      recent activity -- is an unmanaged Project masquerading as an Area
      problem.
    severity: medium
    remediation: Open a PR, or explicitly abandon (push first, then remove), or resume the work.
    incident: 2026-07-31-estate-cleanup

  - id: archive-retention-policy
    title: Safety-net bundles and stale local branch refs must not accumulate indefinitely
    applies_to: git bundle backup directories, stale local branch refs
    check: >
      Any `git bundle` safety-net snapshot older than one full audit cycle
      with no open question it's insuring against should be deleted. Local
      branch refs whose remote counterpart is gone (merged-then-deleted)
      should be pruned on the same cadence.
    severity: low
    remediation: Delete bundles past their retention window; `git branch -d`
      stale local refs after confirming (per capture-before-delete-verified)
      the content is safe.
    incident: 2026-07-31-estate-cleanup

  - id: github-ci-health-current
    title: Every first-party estate repo's default branch must have passing CI
    applies_to: all non-fork, non-archived repos in the org
    check: >
      For each repo, its latest GitHub Actions run on the default branch
      resolves to `success`, not `failure`. Vendored/forked repos are
      excluded (isFork=true) -- CI health on upstream code we don't
      maintain isn't this estate's responsibility. `cancelled` conclusions
      and repos with zero CI runs at all are reported as lower-confidence
      notes, not hard findings -- both have legitimate benign causes
      (a superseding push; a release-only workflow trigger) and treating
      them as failures produces noise that gets ignored.
    severity: high
    remediation: Investigate the actual failing step against the real CI
      runner's OS/architecture (do not assume a local reproduction on a
      different platform explains a Linux Actions runner's failure --
      verify in a matching container). Fix the root cause; don't silence
      the check.
    incident: 2026-08-02-silent-ci-failures

  - id: ops-workflows-run-from-default-branch
    title: Operational workflows (scheduled/deploy/reconcile/mirror/sync) must run from the default branch, never a feature branch
    applies_to: .github/workflows in first-party repos -- scheduled + deploy/reconcile/mirror/sync automation
    check: >
      An operational workflow -- one triggered by `schedule`, or whose job
      deploys/reconciles/mirrors/syncs/provisions live state -- must live and
      run on the repo's DEFAULT branch, not a feature branch. GitHub only
      fires `schedule` and `workflow_dispatch` from the default branch, so
      operational automation stranded on a feature branch silently never
      runs, and a run dispatched from a feature ref executes unreviewed code.
      This is the operational-automation companion to github-ci-health-current
      (which can only watch the default branch): if the automation is not ON
      the default branch, the health check cannot see it fail. The automated
      signal is a scheduled workflow that pins a hardcoded non-default
      checkout `ref:` (proof it is built around a non-default branch); the
      fuller "exists on the default branch" comparison is a review flag, like
      cross-repo-path-dependency-pinned. This governs OPERATIONAL runs, NOT
      day-to-day development -- code still lands via feature branch -> PR ->
      default branch (see resources/day-to-day-git-workflow.md), so it does
      not conflict with policy-fabric's directMainPolicy.
    severity: high
    remediation: Merge the operational workflow to the default branch and let
      it trigger there; remove hardcoded feature `ref:` pins. Rehearse an
      off-branch run in a throwaway workflow, never the production one.
    incident: 2026-08-02-silent-ci-failures

  - id: ci-secrets-minted-never-static-pat
    title: CI credentials must be minted in-workflow (WIF / short-lived App token / in-cluster), never a static PAT or a laptop-held secret
    applies_to: .github/workflows -- any workflow authenticating to GCP, the cluster, a registry (zot/GHCR), or SCM (gitea/GitHub)
    check: >
      A workflow must obtain credentials by MINTING them at run time -- GCP
      Workload Identity Federation (google-github-actions/auth with
      `workload_identity_provider` + `id-token: write`), a short-lived GitHub
      App installation token (actions/create-github-app-token), or an
      in-cluster Job that mounts the secret so it never leaves the cluster --
      NOT a long-lived Personal Access Token held in a GitHub secret, and
      never a credential decoded onto a laptop. Two anti-patterns are hard
      findings: (1) a `secrets.*_PAT` / `*PERSONAL_ACCESS_TOKEN*` used as a
      credential; (2) google-github-actions/auth configured with a static
      `credentials_json:` service-account key instead of WIF. The sovereign
      SCM/registry (gitea, zot) creds live only in-cluster and are reached
      this way; this narrows socioprophet-agent-standards
      004-workload-and-service-identity-standard.md to the SCM/CI case.
      Corollary (enforced by CodeQL py/clear-text-logging-sensitive-data as a
      required check): tooling that DETECTS secret usage must not itself echo
      the matched secret reference into its output or logs -- report the file
      and rule, never the token.
    severity: high
    remediation: Replace the PAT with WIF or a minted App token; replace
      `credentials_json` with `workload_identity_provider`. Rotate the leaked
      static credential. Never handle the value on a laptop or in a terminal.
      A scanner for this control must emit the finding's location, not the
      secret reference it matched.
    incident: 2026-08-02-silent-ci-failures

  - id: main-branch-protection-enforced
    title: A repo's declared branch protection must be committed as IaC and match live state
    applies_to: first-party repos that commit .github/branch-protection.main.json
    check: >
      Branch protection is estate security posture (required checks, whether
      admins can bypass, force-push/deletion, linear history) and must be a
      committed source of truth, not imperative live-only state set by a hand-run
      `gh api PUT`. For each repo that DECLARES protection in
      `.github/branch-protection.main.json`, the repo's live default-branch
      protection must MATCH that spec, field for field (required_status_checks
      strict+contexts, enforce_admins, required_linear_history,
      allow_force_pushes, allow_deletions, required_conversation_resolution,
      required reviews). Live protection that is ABSENT (spec not enforced -- an
      advisory gate) or DRIFTS from the spec is a hard finding. Scoped to opt-in
      by design (like github-ci-health-current): a repo with no committed spec is
      a soft note at most, never nagged, so the check stays precise. Reconcile is
      a deliberate action (workflow_dispatch), never a blind scheduled
      auto-mutation of live security state. The org is not on GitHub Team, so
      classic protection is codified for now; migrate to a repo/org ruleset if
      the tier changes. Executable: scripts/estate_branch_protection_audit.py
      (App token, administration:read to verify live; contents:read to read the
      spec -- unreadable live protection degrades to a soft note, never a false
      finding), workflow .github/workflows/estate-branch-protection.yml.
    severity: high
    remediation: >
      Commit the intended protection as `.github/branch-protection.main.json`;
      re-assert it from that artifact (the estate-branch-protection workflow's
      reconcile dispatch, or `gh api -X PUT .../branches/main/protection --input`
      that file). Never leave protection weaker than the committed spec -- that
      is itself the drift this control detects.
    incident: 2026-08-03-advisory-ci-unprotected-main

  - id: sovereign-git-protection-declared
    title: The sovereign Gitea authority must have committed repo-protection desired-state, reconciled in-cluster
    applies_to: the sovereign git substrate (gitea-sovereign + prophet-platform/deploy/gitea-authority)
    check: >
      Sovereign git is the source of truth GitHub mirrors, so its per-repo protection/ruleset
      posture must be a COMMITTED desired-state artifact, not implicit or GitHub-only. A committed
      sovereign-git protection spec must exist (a closed, schema-validated config in gitea-sovereign
      following its make-validate scaffold), and the live Gitea authority must be reconciled to
      match it. Absence of a committed spec, or live protection that drifts from it, is the finding.
      Because live Gitea mutation is gated behind gitea-sovereign ADR-0006 (runtime-binding gates:
      fail-closed, audit + receipt, negative-path tests), the reconcile must run through that gate
      from CI in-cluster (WIF -> GKE -> authority-minted short-lived token), never a laptop-held or
      static credential (ci-secrets-minted-never-static-pat). Read-only audit is scheduled; reconcile
      is a deliberate workflow_dispatch. GitHub branch protection (main-branch-protection-enforced)
      is the MIRROR of this, not the source.
    severity: high
    remediation: >
      Commit the sovereign-git protection desired-state (schema + fixtures in gitea-sovereign);
      reconcile the live authority to it via the in-cluster CI path behind ADR-0006. Never declare
      protection only on the GitHub mirror.
    incident: 2026-08-03-sovereign-governance-only-on-mirror

  - id: sovereign-registry-policy-enforced
    title: The sovereign registry (zot) desired-state must be committed AND signature verification actually installed
    applies_to: the sovereign registry substrate (prophet-platform/infra/k8s/zot + infra/policy .../verify-signed-images)
    check: >
      zot's desired-state (storage retention/gc, a login-wall with NO anonymous read/write, and
      pull-through sync) must be a committed, ArgoCD-reconciled config
      (infra/k8s/zot/base/configmap.yaml). Separately, image-signature enforcement must be not just
      DECLARED but INSTALLED: the Kyverno verify-signed-images ClusterPolicy
      (validationFailureAction: Enforce, keyless cosign/Fulcio, rekor) must have a running Kyverno
      controller admitting it -- a policy file present in the repo while no controller is connected
      is a declared-not-enforced control (the exact gap found 2026-08-03: the policy file itself
      states it is not yet installed). Hard findings: retention/login-wall/anonymous drift in the
      committed config; or the signing policy present-but-not-installed. Reconciled via ArgoCD/WIF,
      never a laptop credential.
    severity: high
    remediation: >
      Keep the zot configmap as the committed desired-state (retention + login-wall + no anonymous);
      INSTALL the Kyverno controller and admit verify-signed-images so signing is enforced, not just
      written. Verify enforcement against the running cluster, not the file's presence.
    incident: 2026-08-03-sovereign-governance-only-on-mirror

  - id: sovereign-worktracking-native-integrated
    title: Sovereign work-tracking is agora-over-HellGraph (not external Jira), deployed and integrated
    applies_to: the sovereign work-tracking substrate (prophet-platform/apps/agora, deploy/values/agora.yaml)
    check: >
      The sovereign work+knowledge plane is agora over HellGraph (the native Jira/Confluence
      replacement), and it -- not an external Jira/Linear/GitHub-Issues -- is the source of truth;
      external trackers are optional connectors only. As an audited control: agora must be deployed
      (deploy/values/agora.yaml present + a service manifest), its work items must persist as
      HellGraph facts (not a mirrored external store), and its integrations must be wired --
      prophet-workspace (the workspace surface), the sociosphere CI, and the graph. A committed
      dependency/config that makes an EXTERNAL Jira the system of record for estate work, or a
      missing agora deployment / HellGraph binding / prophet-workspace + sociosphere-CI integration,
      is the finding.
    severity: medium
    remediation: >
      Ensure agora is deployed and is the source of truth (work items as HellGraph facts), with its
      prophet-workspace, sociosphere-CI, and graph integrations present; keep any external Jira as an
      optional connector, never the system of record.
    incident: 2026-08-03-sovereign-governance-only-on-mirror
